# ==========================================
# STUDYCHAIN APPLICATION CONFIGURATION
# ==========================================

# Sunucu Ayarları
server.port=8080
server.servlet.context-path=/

# Uygulama Bilgileri
spring.application.name=StudyChain

# PostgreSQL Veritabanı Ayarları
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studychaindb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:study_chain_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:i817ptS02}

# H2 Console (devre dışı)
spring.h2.console.enabled=false

# JPA/Hibernate Ayarları
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Ayarları (Güvenlik için)
jwt.secret=StudyChain2024SecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# Loglama Ayarları
logging.level.com.studychain=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# Static Dosyalar (HTML, CSS, JS)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Admin bootstrap (development)
# Set your email to create/ensure an ADMIN user on startup
admin.email=filginustaoglu@gmail.com
# Provide a password for the admin user (default 'change-me-now' if blank)
admin.password=

# Dev (disable template/static caching for faster feedback)
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Music uploads
music.upload.dir=${MUSIC_UPLOAD_DIR:uploads/music}

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true