# ==========================================
# STUDYCHAIN APPLICATION CONFIGURATION
# ==========================================

# Sunucu Ayarları (Render vb. PLATFORM_PORT veya PORT verir)
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# Uygulama Bilgileri
spring.application.name=StudyChain

# PostgreSQL Veritabanı Ayarları
# Canlıda Render DATABASE_URL verir; tanımlıysa RenderDatabaseConfiguration DataSource oluşturur.
# Yerelde: SPRING_DATASOURCE_* veya PG* ortam değişkenleri / application-local.properties kullanın.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:studychaindb}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:study_chain_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}

# H2 Console (devre dışı)
spring.h2.console.enabled=false

# JPA/Hibernate Ayarları
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Ayarları (Güvenlik için)
jwt.secret=StudyChain2024SecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# Loglama Ayarları
logging.level.com.studychain=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# Static Dosyalar (HTML, CSS, JS)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Admin bootstrap (development)
# Set your email to create/ensure an ADMIN user on startup
admin.email=filginustaoglu@gmail.com
# Provide a password for the admin user (default 'change-me-now' if blank)
admin.password=

# Dev (disable template/static caching for faster feedback)
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Music uploads
music.upload.dir=${MUSIC_UPLOAD_DIR:uploads/music}

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Google Calendar OAuth
# Google Cloud Console'da takvim API'sini açıp bir Web OAuth istemcisi oluşturun.
# Yönlendirme URI: http://localhost:8080/agenda/google/callback
google.calendar.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/agenda/google/callback}